[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverai"
version = "0.1.0"
description = "AI-Powered Revenue Recovery Optimization and Execution System"
authors = [{ name = "RecoverAI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
